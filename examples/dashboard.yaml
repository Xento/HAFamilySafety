# Microsoft Family Safety - full example dashboard
#
# Import via Settings > Dashboards > Raw configuration editor. Install the HACS
# cards listed in family-safety-card.yaml first. Replace the placeholder variables:
#   child  sensor/number/time prefix | lock  switch/button prefix | title/device_label  free text
# Entity IDs carry the device-name prefix; find them under Settings > Devices & Services > Entities.

decluttering_templates:
  fs_child:
    card:
      type: vertical-stack
      cards:
      - type: custom:vertical-stack-in-card
        cards:
        - type: custom:button-card
          name: '[[title]]'
          tap_action:
            action: none
          show_icon: false
          custom_fields:
            health:
              card:
                type: custom:button-card
                show_icon: false
                show_name: false
                entity: sensor.microsoft_family_safety_connection
                tap_action:
                  action: navigate
                  navigation_path: /config/integrations/integration/microsoft_family_safety
                hold_action:
                  action: more-info
                custom_fields:
                  h: '[[[ const c = states[''sensor.microsoft_family_safety_connection'']; if (!c) return ''''; const a = c.attributes || {}; const fam = a.family_context; const reauth = a.reauth_required;
                    let color = ''#4CAF50''; let label = ''OK''; if (reauth) { color = ''#F44336''; label = ''Reauthentication required''; } else if (c.state !== ''connected'' || (fam && fam !== ''ready''))
                    { color = ''#FF9800''; label = ''Session needs renewal''; } return `<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:50%;background:${color};display:inline-block"></span><span
                    style="font-size:11px;opacity:0.7">${label}</span></span>`; ]]]'
                styles:
                  card:
                  - border: none
                  - background: transparent
                  - padding: '0'
                  - margin: '0'
                  - height: auto
                  - border-radius: 0 !important
                  - box-shadow: none
                  custom_fields:
                    h:
                    - justify-self: end
          styles:
            grid:
            - grid-template-areas: '"n health"'
            - grid-template-columns: 1fr auto
            card:
            - height: 40px
            - border: none
            - padding: 0 16px 0 16px
            - margin: '0'
            - box-shadow: none
            - overflow: hidden
            - border-top-left-radius: var(--ha-card-border-radius, 12px)
            - border-top-right-radius: var(--ha-card-border-radius, 12px)
            - border-bottom-left-radius: '0'
            - border-bottom-right-radius: '0'
            name:
            - font-size: 15px
            - font-weight: bold
            - justify-self: start
            - grid-area: n
            custom_fields:
              health:
              - grid-area: health
              - align-self: center
              - justify-self: end
        - type: custom:mod-card
          card_mod:
            style: 'ha-card { height: 1px; background: rgba(152, 152, 157, 0.3); box-shadow: none; border: none; } ha-card { border-radius: 0 !important; }'
          card:
            type: custom:mushroom-title-card
            title: ''
          styles:
            card:
            - border-top-left-radius: '0'
            - border-top-right-radius: '0'
            - border-bottom-left-radius: '0'
            - border-bottom-right-radius: '0'
        - type: custom:stack-in-card
          mode: horizontal
          card_mod:
            style: |-
              :host { --stack-card-gap: 0 !important; }
              ha-card { padding: 0 !important; background: inherit !important; }
              ha-card { border-radius: 0 !important; box-shadow: none !important; }
          cards:
          - type: custom:button-card
            entity: sensor.[[child]]_screen_time
            name: Screen time
            icon: mdi:clock-outline
            show_state: true
            state_display: '[[[ const f = entity.attributes.formatted_time; if (f) { const p = f.split('':''); return p[0] + ''h'' + p[1]; } return entity.state + '' min''; ]]]'
            tap_action:
              action: more-info
            styles:
              card:
              - height: 90px
              - border: none
              - border-right: 1px solid rgba(152,152,157,0.3)
              - padding: 10px 0
              - background: transparent
              - border-radius: 0 !important
              - box-shadow: none
              icon:
              - width: 32px
              - color: var(--primary-color)
              name:
              - font-size: 13px
              - font-weight: '500'
              - opacity: '0.7'
              state:
              - font-size: 16px
              - font-weight: bold
          - type: custom:button-card
            entity: sensor.[[child]]_applications
            name: Blocked apps
            icon: mdi:apps
            show_state: true
            state_display: '[[[ const b = entity.attributes.blocked_count; return (b === undefined ? ''—'' : b) + '' / '' + entity.state; ]]]'
            tap_action:
              action: more-info
            styles:
              card:
              - height: 90px
              - border: none
              - border-right: 1px solid rgba(152,152,157,0.3)
              - padding: 10px 0
              - background: transparent
              - border-radius: 0 !important
              - box-shadow: none
              icon:
              - width: 32px
              - color: '[[[ return (entity.attributes.blocked_count > 0) ? ''#FF9800'' : ''var(--primary-color)''; ]]]'
              name:
              - font-size: 13px
              - font-weight: '500'
              - opacity: '0.7'
              state:
              - font-size: 16px
              - font-weight: bold
          - type: custom:button-card
            entity: sensor.[[child]]_pending_requests
            name: Requests
            icon: mdi:bell-ring-outline
            show_state: true
            tap_action:
              action: more-info
            styles:
              card:
              - height: 90px
              - border: none
              - padding: 10px 0
              - background: transparent
              - border-radius: 0 !important
              - box-shadow: none
              icon:
              - width: 32px
              - color: '[[[ return parseInt(entity.state) > 0 ? ''#FF9800'' : ''var(--primary-color)''; ]]]'
              name:
              - font-size: 13px
              - font-weight: '500'
              - opacity: '0.7'
              state:
              - font-size: 16px
              - font-weight: bold
          styles:
            card:
            - border-top-left-radius: '0'
            - border-top-right-radius: '0'
            - border-bottom-left-radius: '0'
            - border-bottom-right-radius: '0'
        - type: conditional
          conditions:
          - entity: sensor.[[child]]_pending_requests
            state_not: '0'
          card:
            type: custom:vertical-stack-in-card
            cards:
            - type: custom:mod-card
              card_mod:
                style: 'ha-card { height: 1px; background: rgba(152, 152, 157, 0.3); box-shadow: none; border: none; } ha-card { border-radius: 0 !important; }'
              card:
                type: custom:mushroom-title-card
                title: ''
            - type: custom:stack-in-card
              mode: horizontal
              card_mod:
                style: |-
                  :host { --stack-card-gap: 0 !important; }
                  ha-card { padding: 0 !important; background: inherit !important; }
                  ha-card { border-radius: 0 !important; box-shadow: none !important; }
              cards:
              - type: custom:button-card
                entity: button.[[lock]]_approve_request
                name: Approve
                icon: mdi:check-circle
                tap_action:
                  action: toggle
                styles:
                  card:
                  - height: 62px
                  - border: none
                  - border-right: 1px solid rgba(152,152,157,0.3)
                  - padding: 8px 0
                  - background: transparent
                  - border-radius: 0 !important
                  - box-shadow: none
                  icon:
                  - width: 26px
                  - color: '#4CAF50'
                  name:
                  - font-size: 13px
                  - font-weight: '500'
              - type: custom:button-card
                entity: button.[[lock]]_deny_request
                name: Deny
                icon: mdi:close-circle
                tap_action:
                  action: toggle
                styles:
                  card:
                  - height: 62px
                  - border: none
                  - padding: 8px 0
                  - background: transparent
                  - border-radius: 0 !important
                  - box-shadow: none
                  icon:
                  - width: 26px
                  - color: '#F44336'
                  name:
                  - font-size: 13px
                  - font-weight: '500'
            card_mod:
              style: 'ha-card { overflow: hidden; }'
          styles:
            card:
            - border-top-left-radius: '0'
            - border-top-right-radius: '0'
            - border-bottom-left-radius: '0'
            - border-bottom-right-radius: '0'
        - type: custom:mod-card
          card_mod:
            style: 'ha-card { height: 1px; background: rgba(152, 152, 157, 0.3); box-shadow: none; border: none; } ha-card { border-radius: 0 !important; }'
          card:
            type: custom:mushroom-title-card
            title: ''
          styles:
            card:
            - border-top-left-radius: '0'
            - border-top-right-radius: '0'
            - border-bottom-left-radius: '0'
            - border-bottom-right-radius: '0'
        - type: custom:stack-in-card
          mode: horizontal
          card_mod:
            style: |-
              :host { --stack-card-gap: 0 !important; }
              ha-card { padding: 0 !important; background: inherit !important; }
              ha-card { border-radius: 0 !important; box-shadow: none !important; }
          cards:
          - type: custom:button-card
            entity: switch.[[lock]]_lock
            name: Lock
            icon: mdi:lock
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            custom_fields:
              bg: ''
            state:
            - value: 'on'
              icon: mdi:lock
            - value: 'off'
              icon: mdi:lock-open-variant
            styles:
              card:
              - position: relative
              - overflow: hidden
              - height: 70px
              - border: none
              - border-right: 1px solid rgba(152,152,157,0.3)
              - padding: 10px 0
              - background: transparent
              - border-radius: 0 !important
              - box-shadow: none
              custom_fields:
                bg:
                - position: absolute
                - inset: '0'
                - z-index: '0'
                - pointer-events: none
                - background: '[[[ return entity.state === ''on'' ? ''rgb(80,40,40)'' : ''transparent''; ]]]'
              icon:
              - width: 28px
              - z-index: '1'
              - color: '[[[ return entity.state === ''on'' ? ''#F44336'' : ''var(--primary-text-color)''; ]]]'
              - opacity: '[[[ return entity.state === ''on'' ? ''1'' : ''0.5''; ]]]'
              name:
              - font-size: 13px
              - font-weight: '500'
              - z-index: '1'
          - type: custom:button-card
            entity: switch.[[lock]]_windows_lock
            name: Windows
            icon: mdi:microsoft-windows
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            custom_fields:
              bg: ''
            styles:
              card:
              - position: relative
              - overflow: hidden
              - height: 70px
              - border: none
              - border-right: 1px solid rgba(152,152,157,0.3)
              - padding: 10px 0
              - background: transparent
              - border-radius: 0 !important
              - box-shadow: none
              custom_fields:
                bg:
                - position: absolute
                - inset: '0'
                - z-index: '0'
                - pointer-events: none
                - background: '[[[ return entity.state === ''on'' ? ''rgb(80,40,40)'' : ''transparent''; ]]]'
              icon:
              - width: 28px
              - z-index: '1'
              - color: '[[[ return entity.state === ''on'' ? ''#F44336'' : ''var(--primary-text-color)''; ]]]'
              - opacity: '[[[ return entity.state === ''on'' ? ''1'' : ''0.5''; ]]]'
              name:
              - font-size: 13px
              - font-weight: '500'
              - z-index: '1'
          - type: custom:button-card
            entity: switch.[[lock]]_screen_time_limits
            name: Limits
            icon: mdi:clock-check
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            styles:
              card:
              - height: 70px
              - border: none
              - padding: 10px 0
              - background: transparent
              - border-radius: 0 !important
              - box-shadow: none
              icon:
              - width: 28px
              - color: '[[[ return entity.state === ''on'' ? ''#4CAF50'' : ''var(--primary-text-color)''; ]]]'
              - opacity: '[[[ return entity.state === ''on'' ? ''1'' : ''0.5''; ]]]'
              name:
              - font-size: 13px
              - font-weight: '500'
          styles:
            card:
            - overflow: hidden
            - border-top-left-radius: '0'
            - border-top-right-radius: '0'
            - border-bottom-left-radius: var(--ha-card-border-radius, 12px)
            - border-bottom-right-radius: var(--ha-card-border-radius, 12px)
        card_mod:
          style: 'ha-card { overflow: hidden !important; border-radius: var(--ha-card-border-radius, 12px) !important; }'
      - type: custom:vertical-stack-in-card
        cards:
        - type: custom:button-card
          entity: switch.[[lock]]_lock
          name: '[[device_label]]'
          icon: mdi:desktop-tower-monitor
          show_state: false
          tap_action:
            action: toggle
          hold_action:
            action: more-info
          state:
          - value: 'on'
            styles:
              icon:
              - color: '#F44336'
          - value: 'off'
            styles:
              icon:
              - color: '#4CAF50'
          triggers_update:
          - sensor.[[child]]_screen_time
          - switch.[[lock]]_lock
          - number.[[child]]_monday_limit
          - number.[[child]]_tuesday_limit
          - number.[[child]]_wednesday_limit
          - number.[[child]]_thursday_limit
          - number.[[child]]_friday_limit
          - number.[[child]]_saturday_limit
          - number.[[child]]_sunday_limit
          - time.[[child]]_monday_start
          - time.[[child]]_monday_end
          variables:
            screen_data: '[[[ const days = [''sunday'',''monday'',''tuesday'',''wednesday'',''thursday'',''friday'',''saturday'']; const today = days[new Date().getDay()]; const lim = states[''number.[[child]]_''
              + today + ''_limit'']; let limit = lim ? parseFloat(lim.state) : NaN; if (isNaN(limit)) limit = 0; const used = parseFloat(states[''sensor.[[child]]_screen_time''] ? states[''sensor.[[child]]_screen_time''].state
              : 0) || 0; const percent = (limit > 0) ? Math.min(Math.round((used / limit) * 100), 100) : 0; const se = states[''time.[[child]]_'' + today + ''_start'']; const ee = states[''time.[[child]]_''
              + today + ''_end'']; const ok = (e) => e && e.state !== ''unknown'' && e.state !== ''unavailable''; return { limit: Math.round(limit), used: Math.round(used), percent: percent, start: ok(se)
              ? se.state.substring(0,5) : ''--:--'', end: ok(ee) ? ee.state.substring(0,5) : ''--:--'' }; ]]]'
          styles:
            grid:
            - grid-template-areas: '"i n stat" "bar bar bar" "sched sched sched"'
            - grid-template-columns: 40px 1fr auto
            - grid-template-rows: auto auto auto
            - grid-gap: 8px
            card:
            - padding: 12px
            - box-shadow: none
            - overflow: hidden
            - border-top-left-radius: var(--ha-card-border-radius, 12px)
            - border-top-right-radius: var(--ha-card-border-radius, 12px)
            - border-bottom-left-radius: '0'
            - border-bottom-right-radius: '0'
            icon:
            - grid-area: i
            - width: 30px
            - justify-self: start
            name:
            - grid-area: n
            - justify-self: start
            - align-self: center
            - font-weight: bold
            - font-size: 14px
            custom_fields:
              stat:
              - grid-area: stat
              - align-self: center
              - justify-self: end
              - font-size: 14px
              - font-weight: '500'
              - opacity: '0.8'
              bar:
              - grid-area: bar
              sched:
              - grid-area: sched
              - font-size: 13px
              - opacity: '0.7'
              - text-align: center
          custom_fields:
            stat: '[[[ const d = variables.screen_data; return d.limit > 0 ? d.used + ''m / '' + d.limit + ''m'' : d.used + '' min''; ]]]'
            bar: '[[[ const pct = variables.screen_data.percent; let color = ''var(--primary-color)''; if (pct >= 90) color = ''#db4437''; else if (pct >= 75) color = ''#f4b400''; return `<div style="background-color:
              rgba(127,127,127,0.2); border-radius: 6px; width: 100%; height: 12px; overflow: hidden;"><div style="background-color: ${color}; width: ${pct}%; height: 100%;"></div></div>`; ]]]'
            sched: '[[[ const d = variables.screen_data; return `Allowed window : ${d.start} — ${d.end}`; ]]]'
        - type: custom:mod-card
          card_mod:
            style: 'ha-card { height: 1px; background: rgba(152, 152, 157, 0.3); box-shadow: none; border: none; } ha-card { border-radius: 0 !important; }'
          card:
            type: custom:mushroom-title-card
            title: ''
          styles:
            card:
            - border-top-left-radius: '0'
            - border-top-right-radius: '0'
            - border-bottom-left-radius: '0'
            - border-bottom-right-radius: '0'
        - type: custom:button-card
          name: Today's apps
          tap_action:
            action: none
          show_icon: false
          styles:
            card:
            - height: 35px
            - border: none
            - padding: 0 0 0 12px
            - margin: '0'
            - box-shadow: none
            - border-top-left-radius: '0'
            - border-top-right-radius: '0'
            - border-bottom-left-radius: '0'
            - border-bottom-right-radius: '0'
            name:
            - font-size: 13px
            - font-weight: '600'
            - opacity: '0.7'
            - justify-self: start
        - type: custom:button-card
          entity: sensor.[[child]]_applications
          tap_action:
            action: more-info
          show_icon: false
          show_name: false
          show_state: false
          styles:
            card:
            - padding: 0 12px 12px 12px
            - border: none
            - box-shadow: none
            - border-top-left-radius: '0'
            - border-top-right-radius: '0'
            - border-bottom-left-radius: '0'
            - border-bottom-right-radius: '0'
            custom_fields:
              apps:
              - grid-area: apps
              - justify-self: stretch
              - width: 100%
              - text-align: left
            grid:
            - grid-template-areas: '"apps"'
            - grid-template-columns: 1fr
          custom_fields:
            apps: '[[[ const apps = (entity.attributes.applications || []).filter(a => (a.usage_minutes || 0) > 0).sort((a,b) => b.usage_minutes - a.usage_minutes).slice(0,3); if (!apps.length) return `<div
              style="opacity:0.5;font-size:13px;text-align:center;padding:6px 0">No app used today</div>`; const fmt = (m) => { const h = Math.floor(m/60); const r = Math.round(m%60); return h > 0 ? h +
              ''h'' + (r<10?''0'':'''') + r : r + '' min''; }; return `<div style="display:flex;flex-direction:column;gap:8px;width:100%">` + apps.map(a => { const ic = a.icon ? `<img src="${a.icon}" style="width:22px;height:22px;border-radius:4px">`
              : `<span style="width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;opacity:0.4">▪</span>`; const blocked = a.blocked ? `<span style="color:#F44336;font-size:11px;margin-left:6px">blocked</span>`
              : ''''; return `<div style="display:flex;align-items:center;gap:10px">${ic}<span style="flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${a.app_name}${blocked}</span><span
              style="font-size:13px;font-weight:500;opacity:0.8">${fmt(a.usage_minutes)}</span></div>`; }).join('''') + `</div>`; ]]]'
        - type: custom:mod-card
          card_mod:
            style: 'ha-card { height: 1px; background: rgba(152, 152, 157, 0.3); box-shadow: none; border: none; } ha-card { border-radius: 0 !important; }'
          card:
            type: custom:mushroom-title-card
            title: ''
          styles:
            card:
            - border-top-left-radius: '0'
            - border-top-right-radius: '0'
            - border-bottom-left-radius: '0'
            - border-bottom-right-radius: '0'
        - type: custom:button-card
          name: Weekly limits
          tap_action:
            action: none
          show_icon: false
          styles:
            card:
            - height: 35px
            - border: none
            - padding: 0 0 0 12px
            - margin: '0'
            - box-shadow: none
            - border-top-left-radius: '0'
            - border-top-right-radius: '0'
            - border-bottom-left-radius: '0'
            - border-bottom-right-radius: '0'
            name:
            - font-size: 13px
            - font-weight: '600'
            - opacity: '0.7'
            - justify-self: start
        - type: custom:stack-in-card
          mode: horizontal
          card_mod:
            style: |-
              :host { --stack-card-gap: 0 !important; }
              ha-card { padding: 0 4px !important; background: inherit !important; }
              ha-card { border-radius: 0 !important; box-shadow: none !important; }
          cards:
          - type: custom:button-card
            entity: number.[[child]]_monday_limit
            name: Mon
            show_state: true
            show_icon: false
            state_display: '[[[ const v = parseFloat(entity.state); if (isNaN(v)) return ''—''; const h = Math.floor(v/60); const m = v % 60; return h + ''h'' + (m > 0 ? (m < 10 ? ''0'' : '''') + m : '''');
              ]]]'
            tap_action:
              action: more-info
            hold_action:
              action: more-info
              entity: time.[[child]]_monday_start
            custom_fields:
              win: '[[[ const s = states[''time.[[child]]_monday_start'']; const e = states[''time.[[child]]_monday_end'']; const ok = (x) => x && x.state !== ''unknown'' && x.state !== ''unavailable'';
                return ok(s) && ok(e) ? s.state.substring(0,5) + ''-'' + e.state.substring(0,5) : ''''; ]]]'
            styles:
              grid:
              - grid-template-areas: '"n" "s" "win"'
              card:
              - height: 62px
              - border: none
              - border-radius: 8px
              - padding: 4px 0
              - background: '[[[ return new Date().getDay() === 1 ? ''rgba(var(--rgb-primary-color), 0.15)'' : ''transparent''; ]]]'
              - box-shadow: none
              name:
              - font-size: 11px
              - opacity: '0.6'
              - grid-area: n
              state:
              - font-size: 14px
              - font-weight: bold
              - grid-area: s
              custom_fields:
                win:
                - grid-area: win
                - font-size: 9px
                - opacity: '0.45'
          - type: custom:button-card
            entity: number.[[child]]_tuesday_limit
            name: Tue
            show_state: true
            show_icon: false
            state_display: '[[[ const v = parseFloat(entity.state); if (isNaN(v)) return ''—''; const h = Math.floor(v/60); const m = v % 60; return h + ''h'' + (m > 0 ? (m < 10 ? ''0'' : '''') + m : '''');
              ]]]'
            tap_action:
              action: more-info
            hold_action:
              action: more-info
              entity: time.[[child]]_tuesday_start
            custom_fields:
              win: '[[[ const s = states[''time.[[child]]_tuesday_start'']; const e = states[''time.[[child]]_tuesday_end'']; const ok = (x) => x && x.state !== ''unknown'' && x.state !== ''unavailable'';
                return ok(s) && ok(e) ? s.state.substring(0,5) + ''-'' + e.state.substring(0,5) : ''''; ]]]'
            styles:
              grid:
              - grid-template-areas: '"n" "s" "win"'
              card:
              - height: 62px
              - border: none
              - border-radius: 8px
              - padding: 4px 0
              - background: '[[[ return new Date().getDay() === 2 ? ''rgba(var(--rgb-primary-color), 0.15)'' : ''transparent''; ]]]'
              - box-shadow: none
              name:
              - font-size: 11px
              - opacity: '0.6'
              - grid-area: n
              state:
              - font-size: 14px
              - font-weight: bold
              - grid-area: s
              custom_fields:
                win:
